syntax = "proto3";

package payments.v1;

import "google/protobuf/timestamp.proto";

option go_package = "polyglot-ticketing-v1/protogen/go/payments/v1;paymentsv1";

service PaymentsService {
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);
}

message CreatePaymentRequest {
  string order_id = 1;
  string user_id = 2;
}

message CreatePaymentResponse {
  Payment payment = 1;
  bool created = 2;
}

message Payment {
  string id = 1;
  string order_id = 2;
}

// PaymentCreated records that Payments accepted an order for processing.
message PaymentCreated {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string payment_id = 3;
  string order_id = 4;
}

// PaymentSucceeded records that a payment completed successfully.
message PaymentSucceeded {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string payment_id = 3;
  string order_id = 4;
}

// PaymentFailed records that a payment could not be completed.
message PaymentFailed {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string payment_id = 3;
  string order_id = 4;
}
