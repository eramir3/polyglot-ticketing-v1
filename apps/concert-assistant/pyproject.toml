[project]
name = "concert-assistant"
version = "0.1.0"
description = "Concert Assistant AI chat service scaffold"
readme = "README.md"
authors = [
    { email = "estebanramirezcc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.26.0",
    "ollama>=0.6.1",
    "openai>=3.8.0",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "sqlglot>=30.18.0",
]

[project.scripts]
concert-assistant = "concert_assistant:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
