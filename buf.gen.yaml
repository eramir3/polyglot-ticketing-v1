version: v2
plugins:
  - local: protoc-gen-es
    out: protogen/ts
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
  - remote: buf.build/protocolbuffers/go
    out: apps/tickets/gen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: apps/tickets/gen
    opt:
      - paths=source_relative
inputs:
  - directory: proto
