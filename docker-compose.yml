services:
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile.dev
    image: api-gateway:dev
    container_name: api-gateway
    environment:
      NODE_ENV: development
      PORT: 3000
      IDENTITY_GRPC_URL: identity:50051
      ORDERS_GRPC_URL: orders:50053
      PAYMENTS_GRPC_URL: payments:50054
      TICKETS_GRPC_URL: tickets:50052
      LOAD_TEST_METRICS_TOKEN: ${LOAD_TEST_METRICS_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: alloy:4318
      TICKETING_USER_APP_ORIGIN: ${TICKETING_USER_APP_ORIGIN:-http://localhost:3001}
    ports:
      - '3000:3000'
    expose:
      - '9090'
    depends_on:
      - identity
      - payments
      - tickets

  tickets:
    build:
      context: .
      dockerfile: apps/tickets/Dockerfile.dev
    image: tickets:dev
    container_name: tickets
    environment:
      DATABASE_URL: postgresql://tickets:${TICKETS_DB_PASSWORD:?TICKETS_DB_PASSWORD must be set}@tickets-db:5432/tickets-db?sslmode=disable
      GRPC_PORT: 50052
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: alloy:4318
    depends_on:
      tickets-db:
        condition: service_healthy
      tickets-migrate:
        condition: service_completed_successfully
    expose:
      - '50052'
      - '9090'

  nats:
    image: nats:2.11-alpine
    container_name: nats
    command: ['-js', '-sd', '/data', '-m', '8222']
    ports:
      - '4222:4222'
      - '127.0.0.1:8222:8222'
    volumes:
      - nats-data:/data

  redis:
    image: redis:7.4-alpine
    container_name: expiration-redis
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '6379:6379'
    volumes:
      - expiration-redis-data:/data

  expiration:
    build:
      context: .
      dockerfile: apps/expiration/Dockerfile.dev
    image: expiration:dev
    container_name: expiration
    environment:
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: alloy:4318
    depends_on:
      nats:
        condition: service_started
      redis:
        condition: service_healthy
    expose:
      - '9090'

  k6:
    image: grafana/k6:2.2.0
    profiles: ['performance']
    depends_on:
      api-gateway:
        condition: service_started
      prometheus:
        condition: service_started
    environment:
      K6_BASE_URL: ${K6_BASE_URL:-http://api-gateway:3000}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),avg,min,max
      LOAD_TEST_METRICS_TOKEN: ${LOAD_TEST_METRICS_TOKEN:-}
    volumes:
      - ./tests/performance/k6:/scripts:ro

  tickets-performance-seed:
    image: postgres:17-alpine
    profiles: ['performance']
    depends_on:
      tickets-db:
        condition: service_healthy
      tickets-migrate:
        condition: service_completed_successfully
    environment:
      PGDATABASE: tickets-db
      PGHOST: tickets-db
      PGPASSWORD: ${TICKETS_DB_PASSWORD:?TICKETS_DB_PASSWORD must be set}
      PGUSER: tickets
    command: ['psql', '-v', 'ON_ERROR_STOP=1', '-f', '/seed/tickets.sql']
    volumes:
      - ./tests/performance/seed/tickets.sql:/seed/tickets.sql:ro

  nui:
    build:
      context: .
      dockerfile: infra/nui/Dockerfile
    image: nui:dev
    container_name: nui
    profiles: ['tools']
    depends_on:
      - nats
    ports:
      - '127.0.0.1:31311:31311'
    volumes:
      - nui-data:/db

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    profiles: ['tools']
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:5540:5540'
    volumes:
      - redisinsight-data:/data

  loki:
    image: grafana/loki:3.6.0
    container_name: loki
    profiles: ['tools']
    command: ['-config.file=/etc/loki/config.yml']
    depends_on:
      loki-init:
        condition: service_completed_successfully
    volumes:
      - ./infra/observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  loki-init:
    image: busybox:1.37
    container_name: loki-init
    profiles: ['tools']
    user: '0:0'
    command: ['sh', '-c', 'mkdir -p /loki && chown -R 10001:10001 /loki']
    restart: 'no'
    volumes:
      - loki-data:/loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles: ['tools']
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    ports:
      - '127.0.0.1:3002:3000'
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: prometheus
    profiles: ['tools']
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-remote-write-receiver'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  tempo:
    image: grafana/tempo:3.0.0
    container_name: tempo
    profiles: ['tools']
    command: ['-config.file=/etc/tempo/config.yml']
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    volumes:
      - ./infra/observability/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo

  tempo-init:
    image: busybox:1.37
    container_name: tempo-init
    profiles: ['tools']
    user: '0:0'
    command: ['sh', '-c', 'mkdir -p /var/tempo && chown -R 10001:10001 /var/tempo']
    restart: 'no'
    volumes:
      - tempo-data:/var/tempo

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    profiles: ['tools']
    command:
      [
        'run',
        '--server.http.listen-addr=0.0.0.0:12345',
        '/etc/alloy/config.alloy',
      ]
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
    expose:
      - '4318'
    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  tickets-migrate:
    build:
      context: .
      dockerfile: apps/tickets/Dockerfile.dev
    image: tickets-migrate:dev
    container_name: tickets-migrate
    command: ['tickets-migrate']
    environment:
      DATABASE_URL: postgresql://tickets:${TICKETS_DB_PASSWORD:?TICKETS_DB_PASSWORD must be set}@tickets-db:5432/tickets-db?sslmode=disable
    depends_on:
      tickets-db:
        condition: service_healthy
    restart: 'no'

  tickets-db:
    image: postgres:17-alpine
    container_name: tickets-db
    environment:
      POSTGRES_DB: tickets-db
      POSTGRES_PASSWORD: ${TICKETS_DB_PASSWORD:?TICKETS_DB_PASSWORD must be set}
      POSTGRES_USER: tickets
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tickets -d tickets-db']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5433:5432'
    volumes:
      - tickets-db-data:/var/lib/postgresql/data

  orders:
    build:
      context: .
      dockerfile: apps/orders/Dockerfile.dev
    image: orders:dev
    container_name: orders
    environment:
      DATABASE_URL: postgresql://orders:${ORDERS_DB_PASSWORD:?ORDERS_DB_PASSWORD must be set}@orders-db:5432/orders-db?sslmode=disable
      GRPC_PORT: 50053
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: alloy:4318
    depends_on:
      nats:
        condition: service_started
      orders-db:
        condition: service_healthy
      orders-migrate:
        condition: service_completed_successfully
    expose:
      - '50053'
      - '9090'

  orders-migrate:
    build:
      context: .
      dockerfile: apps/orders/Dockerfile.dev
    image: orders-migrate:dev
    container_name: orders-migrate
    command: ['orders-migrate']
    environment:
      DATABASE_URL: postgresql://orders:${ORDERS_DB_PASSWORD:?ORDERS_DB_PASSWORD must be set}@orders-db:5432/orders-db?sslmode=disable
    depends_on:
      orders-db:
        condition: service_healthy
    restart: 'no'

  orders-db:
    image: postgres:17-alpine
    container_name: orders-db
    environment:
      POSTGRES_DB: orders-db
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:?ORDERS_DB_PASSWORD must be set}
      POSTGRES_USER: orders
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orders -d orders-db']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5434:5432'
    volumes:
      - orders-db-data:/var/lib/postgresql/data

  payments:
    build:
      context: .
      dockerfile: apps/payments/Dockerfile.dev
    image: payments:dev
    container_name: payments
    environment:
      DATABASE_URL: postgresql://payments:${PAYMENTS_DB_PASSWORD:?PAYMENTS_DB_PASSWORD must be set}@payments-db:5432/payments-db?sslmode=disable
      GRPC_PORT: 50054
      NATS_URL: nats://nats:4222
      PAYMENT_PROCESSOR_OUTCOME: ${PAYMENT_PROCESSOR_OUTCOME:-success}
      PAYMENT_PROCESSOR_RANDOM_FAILURES: ${PAYMENT_PROCESSOR_RANDOM_FAILURES:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: alloy:4318
    depends_on:
      nats:
        condition: service_started
      payments-db:
        condition: service_healthy
      payments-migrate:
        condition: service_completed_successfully
    expose:
      - '50054'
      - '9090'

  payments-migrate:
    build:
      context: .
      dockerfile: apps/payments/Dockerfile.dev
    image: payments-migrate:dev
    container_name: payments-migrate
    command: ['payments-migrate']
    environment:
      DATABASE_URL: postgresql://payments:${PAYMENTS_DB_PASSWORD:?PAYMENTS_DB_PASSWORD must be set}@payments-db:5432/payments-db?sslmode=disable
    depends_on:
      payments-db:
        condition: service_healthy
    restart: 'no'

  payments-db:
    image: postgres:17-alpine
    container_name: payments-db
    environment:
      POSTGRES_DB: payments-db
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD:?PAYMENTS_DB_PASSWORD must be set}
      POSTGRES_USER: payments
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payments -d payments-db']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5435:5432'
    volumes:
      - payments-db-data:/var/lib/postgresql/data

  identity:
    build:
      context: .
      dockerfile: apps/identity/Dockerfile.dev
    image: identity:dev
    container_name: identity
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be set}
      DATABASE_URL: postgresql://identity:${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be set}@identity-db:5432/identity-db
      EMAIL_VERIFICATION_URL: ${EMAIL_VERIFICATION_URL:-http://localhost:3000/api/auth/verify-email}
      NODE_ENV: development
      GRPC_PORT: 50051
      OTEL_EXPORTER_OTLP_ENDPOINT: alloy:4318
      SMTP_FROM: ${SMTP_FROM:-no-reply@polyglot-ticketing.local}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      TICKETING_USER_APP_ORIGIN: ${TICKETING_USER_APP_ORIGIN:-http://localhost:3001}
    depends_on:
      identity-db:
        condition: service_healthy
      identity-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    expose:
      - '50051'
      - '9090'

  identity-migrate:
    image: identity:dev
    container_name: identity-migrate
    command: ['node', 'dist/apps/identity/apps/identity/src/migrate.js']
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be set}
      DATABASE_URL: postgresql://identity:${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be set}@identity-db:5432/identity-db
      SMTP_FROM: ${SMTP_FROM:-no-reply@polyglot-ticketing.local}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      identity-db:
        condition: service_healthy
    restart: 'no'

  identity-db:
    image: postgres:17-alpine
    container_name: identity-db
    environment:
      POSTGRES_DB: identity-db
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be set}
      POSTGRES_USER: identity
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U identity -d identity-db']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - identity-db-data:/var/lib/postgresql/data

  concert-assistant-db:
    image: postgres:17-alpine
    container_name: concert-assistant-db
    environment:
      POSTGRES_DB: concert-assistant-db
      POSTGRES_PASSWORD: ${CONCERT_ASSISTANT_DB_PASSWORD:?CONCERT_ASSISTANT_DB_PASSWORD must be set}
      POSTGRES_USER: concert-assistant
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U concert-assistant -d concert-assistant-db']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5436:5432'
    volumes:
      - concert-assistant-db-data:/var/lib/postgresql/data
      - ./concerts.dump:/restore/concerts.dump:ro
      - ./apps/concert-assistant/scripts/restore-concerts.sh:/restore/restore-concerts.sh:ro

  mailpit:
    image: axllent/mailpit:v1.28
    container_name: mailpit
    ports:
      - '8025:8025'
    expose:
      - '1025'

volumes:
  identity-db-data:
  tickets-db-data:
  orders-db-data:
  payments-db-data:
  concert-assistant-db-data:
  nats-data:
  expiration-redis-data:
  nui-data:
  redisinsight-data:
  loki-data:
  grafana-data:
  prometheus-data:
  tempo-data:
